---
- name: Turing Pi Cluster Information
  hosts: turing_cluster
  gather_facts: true

  tasks:
    - name: Display cluster name
      ansible.builtin.debug:
        msg: "Cluster: {{ cluster_name }}"

    - name: Display node node_role
      ansible.builtin.debug:
       msg: "Role: {{ node_role }}"

    - name: Display node node_location
      ansible.builtin.debug:
        msg: "Location: {{ node_location }}"

    - name: Display hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ ansible_hostname }}"

    - name: Display operating system
      ansible.builtin.debug:
        msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Display architecture
      ansible.builtin.debug:
        msg: "Architecture: {{ ansible_architecture }}"

    - name: Display processor core count
      ansible.builtin.debug:
        msg: "CPU cores: {{ ansible_processor_vcpus }}"

    - name: Display total memory
      ansible.builtin.debug:
        msg: "Memory: {{ ansible_memtotal_mb }} MB"

    - name: Display IPv4 address
      ansible.builtin.debug:
        msg: "IP address: {{ ansible_default_ipv4.address }}"

    - name: Get Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Get root disk usage
      ansible.builtin.command: df -h /
      register: disk_usage
      changed_when: false

    - name: Display root disk usage
      ansible.builtin.debug:
        msg: "{{ disk_usage.stdout_lines[1] }}"