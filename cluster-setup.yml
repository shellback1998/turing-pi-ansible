---
- name: Configure Turing Pi Cluster
  hosts: turing_cluster
  become: true


  tasks:
    - name: Ensure htop is installed
      ansible.builtin.apt:
        name: htop
        state: present

    - name: Ensure cluster info directory exists
      ansible.builtin.file:
        path: /opt/turing-cluster
        state: directory
        mode: "0755"
    
    - name: Create cluster information file
      ansible.builtin.copy:
        dest: /opt/turing-cluster/README.txt
        content: |
          Turing Pi Cluster
          Managed by Ansible
          Hostname: {{ ansible_hostname }}
        mode: "0644"