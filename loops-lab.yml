---
- name: Ansible Loops Lab
  hosts: turing_cluster
  become: true

  tasks:
    - name: Create cluster test files
      ansible.builtin.file:
        path: "/tmp/{{ item }}"
        state: touch
        mode: "0644"
      loop:
        - loop-test-1.txt
        - loop-test-2.txt
        - loop-test-3.txt

    - name: Create cluster info files
      ansible.builtin.copy:
        dest: "/tmp/ {{ item.filename }}"
        content: " {{ item.content }}"
        mode: "0644"
      loop:
        - filename: node-role.txt
          content: "Role: {{ node_role }}"
        - filename: "Location: {{ node_location }}"